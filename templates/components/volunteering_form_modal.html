<div
    id="add-volunteering-modal"
    class="volunteering-form-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="add-volunteering-modal-title"
>
    <button
        type="button"
        class="volunteering-form-modal__backdrop"
        popovertarget="add-volunteering-modal"
        popovertargetaction="hide"
        aria-label="Tutup form tambah volunteering"
    ></button>

    <div class="volunteering-form-modal__content">

        <button
            type="button"
            class="volunteering-form-modal__close"
            popovertarget="add-volunteering-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah volunteering"
        >
            ×
        </button>

        <h2 id="add-volunteering-modal-title">
            Add New Volunteering
        </h2>

        <form
            id="volunteering-form"
            method="post"
            action="{% url 'main:create_volunteering' %}"
            class="volunteering-form"
        >
            {% csrf_token %}

            {% for field in form %}

                <div class="form-group">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% for error in field.errors %}
                        <p class="form-error">
                            {{ error }}
                        </p>
                    {% endfor %}

                </div>

            {% endfor %}

            <div class="volunteering-form-modal__actions">

                <button
                    type="button"
                    class="button button-secondary"
                    popovertarget="add-volunteering-modal"
                    popovertargetaction="hide"
                >
                    Batal
                </button>

                <button type="submit" class="button">
                    Add Volunteering
                </button>

            </div>

        </form>

    </div>
</div>
